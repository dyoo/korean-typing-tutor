<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="key" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" />
  <!-- Inner keycap bezel -->
  <rect x="64" y="64" width="384" height="384" rx="72" fill="url(#key)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="8" />
  <!-- Hangul '한' glyph -->
  <text x="256" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="230" font-weight="800" fill="#ffffff" text-anchor="middle">한</text>
</svg>